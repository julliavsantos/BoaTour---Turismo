<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Jajazinho - Boatur</title>
    <link rel="stylesheet" href="style.css">
     <link rel="icon" type="img" href="../img/apenaslogo.png">
</head>
 
<body>
    

    <div class="fundo">
       
    <div class="titulo">
    <h1>Assistente virtual - Julianinha</h1>
    <p>Seu companheiro de viagens!</p>
    
    </div>


      <div class="conteudo">
        
  
<div id="chat" class="chat">

    <p class="mensagem bot">
        <strong>Julianinha:</strong>
        Olá! Eu sou a Julianinha, assistente virtual da Boatur. Como posso ajudar?
    </p>

    <input
        id="mensagem"
        type="text"
        placeholder="Digite sua mensagem..."
        autocomplete="off"
    >

    <button onclick="enviar()">
        Enviar
    </button>

</div>


  <div class="folder">

    <img src="../img/img1.png" class="imagem ativa">
    <img src="../img/img2.png" class="imagem">
    <img src="../img/img3.png" class="imagem">

</div>

<div class="menuLateral">
   <div class="opcoes-rapidas">

    <h3>Opções rápidas</h3>
    <button class="opcao-rapida">
         <span>𖦹</span>
        <p>Destinos mais buscados</p>
    </button>
    <button class="opcao-rapida">
        <span>🎟</span>
        <p>Pacotes em promoção</p>
    </button>
    <button class="opcao-rapida">
        <span>✈︎</span>
        <p>Passagens aéreas</p>
    </button>
    <button class="opcao-rapida">
        <span>📽</span>
        <p>Dicas de viagem</p>
    </button>
    <button class="opcao-rapida">
        <span>☊</span>
        <p>Falar com atendente</p>
    </button>

</div>
</div>


    <script src="script.js"> </script>
    <script src="darkmodedemais.js"></script>

   </div>

    </div>

</body>
</html>
